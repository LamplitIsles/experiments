pre-commit:
  commands:
    bun-lock-check:
      glob: "{package.json,**/package.json,bun.lock}"
      run: |
        bun install --frozen-lockfile || {
          echo ""
          echo "bun.lock is stale. Run: bun install"
          exit 1
        }
    format-check:
      run: bun run format:check
    lint:
      run: bun run lint
